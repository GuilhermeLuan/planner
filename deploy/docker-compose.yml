services:
  planner-server:
    build:
      context: ../server
    environment:
      PLANNER_HTTP_ADDR: ":8080"
      PLANNER_DB_PATH: "/data/planner.db"
      PLANNER_BACKUP_DIR: "/backups"
      PLANNER_BACKUP_RETENTION_DAYS: "${PLANNER_BACKUP_RETENTION_DAYS:-14}"
      PLANNER_ADMIN_USERNAME: "${PLANNER_ADMIN_USERNAME:?configure PLANNER_ADMIN_USERNAME}"
      PLANNER_ADMIN_PASSWORD: "${PLANNER_ADMIN_PASSWORD:?configure PLANNER_ADMIN_PASSWORD}"
    ports:
      - "${PLANNER_PORT:-8080}:8080"
    volumes:
      - planner-data:/data
      - "${PLANNER_BACKUP_HOST_DIR:-./backups}:/backups"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  planner-data:
